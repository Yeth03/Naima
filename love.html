<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <meta name="description" content="A little date invitation for this Sunday.">
  <title>Naima — A Little Invitation</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f2eb;
      --muted: #aaa6b1;
      --pink: #ff6f91;
      --gold: #f7c979;
      --panel: rgba(28, 27, 35, .84);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px;
      background:
        radial-gradient(ellipse at 18% 15%, rgba(119, 65, 123, .29), transparent 35%),
        radial-gradient(ellipse at 88% 85%, rgba(164, 87, 67, .2), transparent 33%),
        #101116;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .stars, .stars::before, .stars::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image:
        radial-gradient(1px 1px at 12% 22%, #fff 98%, transparent),
        radial-gradient(1px 1px at 72% 14%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 86% 67%, #f7c979 98%, transparent),
        radial-gradient(1px 1px at 28% 78%, #fff 98%, transparent),
        radial-gradient(1px 1px at 54% 43%, #fff 98%, transparent);
      background-size: 290px 260px;
      opacity: .46;
    }

    .stars::before {
      transform: translate(80px, 110px);
      opacity: .45;
    }

    .card {
      position: relative;
      width: min(100%, 500px);
      padding: clamp(32px, 8vw, 54px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 30px 100px rgba(0, 0, 0, .48), 0 0 70px rgba(255, 111, 145, .08);
      text-align: center;
      backdrop-filter: blur(18px);
      animation: enter .75s ease-out both;
    }

    .card::before {
      position: absolute;
      top: 0;
      left: 18%;
      width: 64%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(247, 201, 121, .8), transparent);
      content: "";
    }

    .tag {
      margin: 0 0 23px;
      color: var(--gold);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .icon {
      display: grid;
      width: 70px;
      height: 70px;
      margin: 0 auto 23px;
      place-items: center;
      border: 1px solid rgba(247, 201, 121, .3);
      border-radius: 50%;
      background: rgba(247, 201, 121, .08);
      color: var(--gold);
      font-size: 1.8rem;
      box-shadow: 0 0 30px rgba(247, 201, 121, .1);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 9vw, 3.25rem);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: 1.12;
    }

    .question {
      margin: 19px 0 0;
      color: #d7d2dc;
      font-size: clamp(1.05rem, 4vw, 1.22rem);
      line-height: 1.7;
    }

    .question strong {
      color: var(--ink);
      font-weight: 650;
    }

    .date-details {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 23px 0 29px;
      color: var(--muted);
      font-size: .87rem;
    }

    .date-details span {
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 999px;
      background: rgba(255, 255, 255, .035);
    }

    .buttons {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 170px;
      gap: 12px;
    }

    button {
      min-height: 51px;
      padding: 12px 16px;
      border: 1px solid transparent;
      border-radius: 14px;
      cursor: pointer;
      font: inherit;
      font-size: .92rem;
      font-weight: 700;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    .yes {
      align-self: start;
      background: linear-gradient(135deg, #ff819a, #ed5477);
      color: #24151b;
      box-shadow: 0 9px 24px rgba(237, 84, 119, .23);
    }

    .yes:hover { box-shadow: 0 12px 30px rgba(237, 84, 119, .36); }

    .later {
      position: absolute;
      top: 64px;
      right: 0;
      width: calc(50% - 6px);
      z-index: 1;
      border-color: rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .045);
      color: #d0cbd5;
      transition: left .045s ease-out, top .045s ease-out, transform .045s ease-out, background .18s ease;
    }

    .later:hover { background: rgba(255, 255, 255, .09); }

    .response {
      min-height: 28px;
      margin: 20px 0 0;
      color: var(--gold);
      font-size: .96rem;
      line-height: 1.5;
    }

    .note {
      margin: 14px 0 0;
      color: #88838e;
      font-size: .77rem;
    }

    .sparkle {
      position: fixed;
      z-index: 2;
      top: -20px;
      color: var(--gold);
      pointer-events: none;
      animation: fall 2.8s ease-in forwards;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fall {
      to { opacity: 0; transform: translateY(110vh) rotate(200deg); }
    }

    @media (max-width: 420px) {
      .buttons {
        grid-template-columns: 1fr;
        min-height: 170px;
      }

      .later {
        top: 64px;
        right: 0;
        width: calc(50% - 6px);
      }

      .date-details { gap: 7px; }
      .date-details span { padding: 8px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="card">
    <p class="tag">A little question for you</p>
    <div class="icon" aria-hidden="true">✦</div>
    <h1>Naima</h1>
    <p class="question">Sasama ka ba sa'kin sa Sunday sa <strong>CABS</strong>?</p>
    <div class="date-details" aria-label="Date details">
      <span>♡ This Sunday</span>
      <span>✦ CABS, Cabuyao</span>
    </div>
    <div class="buttons">
      <button class="yes" id="yesButton" type="button">Yes, let's go ✨</button>
      <button class="later" id="noButton" type="button">No</button>
    </div>
    <p class="response" id="response" aria-live="polite"></p>
    <p class="note">No pressure—just thought I'd ask 😊</p>
  </main>

  <script>
    const response = document.querySelector("#response");

    document.querySelector("#yesButton").addEventListener("click", () => {
      response.textContent = "It's a date! Looking forward to Sunday 🥰";

      for (let i = 0; i < 24; i += 1) {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";
        sparkle.setAttribute("aria-hidden", "true");
        sparkle.textContent = i % 2 === 0 ? "✦" : "♡";
        sparkle.style.left = `${Math.random() * 100}%`;
        sparkle.style.animationDelay = `${Math.random() * 1.2}s`;
        sparkle.style.fontSize = `${12 + Math.random() * 14}px`;
        document.body.append(sparkle);
        sparkle.addEventListener("animationend", () => sparkle.remove(), { once: true });
      }
    });

    const noButton = document.querySelector("#noButton");
    const buttons = document.querySelector(".buttons");
    const yesButton = document.querySelector("#yesButton");

    const dodgeNoButton = (event) => {
      if (event.pointerType === "touch") return;

      const bounds = buttons.getBoundingClientRect();
      const buttonBounds = noButton.getBoundingClientRect();
      const yesBounds = yesButton.getBoundingClientRect();
      const maxLeft = bounds.width - buttonBounds.width;
      const maxTop = bounds.height - buttonBounds.height;
      const currentLeft = noButton.style.left === "" ? maxLeft : Number.parseFloat(noButton.style.left);
      const currentTop = Number.parseFloat(noButton.style.top || getComputedStyle(noButton).top) || 0;
      const yesLeft = yesBounds.left - bounds.left;
      const yesTop = yesBounds.top - bounds.top;
      const pointerX = event.clientX - bounds.left;
      const pointerY = event.clientY - bounds.top;
      const candidates = [];

      for (let row = 0; row <= 4; row += 1) {
        for (let column = 0; column <= 4; column += 1) {
          const left = maxLeft * column / 4;
          const top = maxTop * row / 4;
          const overlapsYes = left < yesLeft + yesBounds.width + 8
            && left + buttonBounds.width + 8 > yesLeft
            && top < yesTop + yesBounds.height + 8
            && top + buttonBounds.height + 8 > yesTop;
          const movedEnough = Math.hypot(left - currentLeft, top - currentTop) > 35;
          if (!overlapsYes && movedEnough) candidates.push({ left, top });
        }
      }

      const awayFromPointer = candidates.filter((position) => Math.hypot(
        position.left + buttonBounds.width / 2 - pointerX,
        position.top + buttonBounds.height / 2 - pointerY
      ) > 80);
      const options = awayFromPointer.length ? awayFromPointer : candidates;
      const next = options[Math.floor(Math.random() * options.length)];
      if (!next) return;

      noButton.style.left = `${next.left}px`;
      noButton.style.top = `${next.top}px`;
      noButton.style.right = "auto";
    };

    noButton.addEventListener("pointerenter", dodgeNoButton);
    buttons.addEventListener("pointermove", (event) => {
      if (event.pointerType === "touch") return;
      const buttonBounds = noButton.getBoundingClientRect();
      const distance = Math.hypot(
        buttonBounds.left + buttonBounds.width / 2 - event.clientX,
        buttonBounds.top + buttonBounds.height / 2 - event.clientY
      );
      if (distance < 85) dodgeNoButton(event);
    });

    noButton.addEventListener("click", () => {
      response.textContent = "wag muna subukan mag NO 😊";
    });
  </script>
</body>
</html>
